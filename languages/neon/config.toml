name = "NEON"
grammar = "neon"
path_suffixes = ["neon"]
line_comments = ["# "]
tab_size = 4
hard_tabs = true
autoclose_before = ",]}"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
